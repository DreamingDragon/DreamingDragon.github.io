<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/art_assets/icon/favicon.ico">
  
  <title>⟁ ⌬ ⊕ ☿ ⟡</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Your CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Page Title -->
  <div class="title-plate">
    <h1 class="text-center my-4 machine-title no-select">ᚲ╬⟡⟡𐌃ᚲ 𐌄╬𐑑╬𐌔⟁⟢╫𐑑𐑒⟁╬ 𐌔⟡╫𐌄ᚲ</h1>
  </div>
  <!-- Machine Container -->
    <div class="machine mx-auto">
       <!-- Machine Container Rivets -->
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <div class="row justify-content-center align-items-center gx-4 gy-4">
  
        <!-- LEFT SIDE -->
        <!-- Input Grid Column -->
        <div class="col-8 d-flex flex-column justify-content-center">
          <div class="input-group top-group">
            <div class="input-grid">
              <div class="slot" id="slot1" data-value="0"><img src="art_assets/glyphs/Glyph_0.svg" alt="glyph0" class="no-select"></div>
              <div class="slot" id="slot2" data-value="0"><img src="art_assets/glyphs/Glyph_0.svg" alt="glyph0" class="no-select"></div>
              <div class="slot" id="slot3" data-value="0"><img src="art_assets/glyphs/Glyph_0.svg" alt="glyph0" class="no-select"></div>
              <div class="slot" id="slot4" data-value="0"><img src="art_assets/glyphs/Glyph_0.svg" alt="glyph0" class="no-select"></div>
            </div>
          </div>
            <div class="input-group bottom-group">
              <div class="input-grid">
                <div class="slot" id="slot5" data-value="0"><img src="art_assets/glyphs/Glyph_0.svg" alt="glyph0" class="no-select"></div>
                <div class="slot" id="slot6" data-value="0"><img src="art_assets/glyphs/Glyph_0.svg" alt="glyph0" class="no-select"></div>
                <div class="slot" id="slot7" data-value="0"><img src="art_assets/glyphs/Glyph_0.svg" alt="glyph0" class="no-select"></div>
                <div class="slot" id="slot8" data-value="0"><img src="art_assets/glyphs/Glyph_0.svg" alt="glyph0" class="no-select"></div>
              </div>
            </div>
        </div>
  
        <!-- RIGHT SIDE -->
        <!-- Output Column -->
        <div class="col-4 d-flex flex-column align-items-center">
          <div class="output-slot" id="result" data-value="0">
            <div class="output-cell"><img src="art_assets/glyphs/OutputGlyph_0.svg" alt="" class="flip-hv no-select"></div>
            <div class="output-cell"><img src="art_assets/glyphs/OutputGlyph_0.svg" alt="" class="flip-v no-select"></div>
            <div class="output-cell"><img src="art_assets/glyphs/OutputGlyph_0.svg" alt="" class="flip-h no-select"></div>
            <div class="output-cell"><img src="art_assets/glyphs/OutputGlyph_0.svg" alt="" class="no-select"></div>
          </div>
          <div class="machine-output-buttons">
            <button id="addButton" class="btn btn-primary mt-3" onclick="calculateMachineOutput()"></button>
            <button id="clearButton" class="btn btn-primary mt-3" onclick="animateSlotsToValue(0)"></button>
          </div>
        </div>
  
      </div>
    </div>

  <!-- Optional Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your JS -->
  <script src="js/script.js"></script>
</body>
</html>
